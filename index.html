<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>线条小狗 · 校园陪伴</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="sparkles"></div>

  <section id="hero" class="card">
    <span class="hero-sparkle">✦</span>
    <span class="hero-sparkle">✧</span>
    <span class="hero-sparkle">·</span>
    <span class="hero-sparkle">✧</span>
    <div id="greeting-text" class="greeting-main"></div>
    <div id="weather-card" class="weather-inline"></div>
  </section>

  <section id="puppy-zone">
    <img id="puppy-img" src="" alt="线条小狗">
    <div id="puppy-speech" class="speech-bubble hidden"></div>
  </section>

  <section id="fortune-card" class="card">
    <div id="fortune-display"></div>
  </section>

  <section id="message-card" class="card">
    <div id="warm-message"></div>
    <button id="refresh-message" class="btn-subtle">🔄 换一句</button>
  </section>

  <section id="schedule-card" class="card">
    <h3 class="card-title">📚 今日课表</h3>
    <div id="today-schedule"></div>
    <div id="next-class-countdown"></div>
  </section>

  <section id="period-card" class="card">
    <h3 class="card-title">🌸 生理期小助手</h3>
    <div id="period-status"></div>
  </section>

  <section id="exam-card" class="card">
    <h3 class="card-title">📝 考试倒计时</h3>
    <div id="exam-display"></div>
  </section>

  <section id="diary-card" class="card">
    <h3 class="card-title">📔 心情日记</h3>
    <div id="diary-display"></div>
  </section>

  <section id="photo-card" class="card">
    <h3 class="card-title">🖼 照片墙</h3>
    <div id="photo-display"></div>
  </section>

  <footer>
    <button id="open-settings" class="btn-subtle">⚙ 设置</button>
  </footer>

  <div id="notify-toast" class="toast hidden"></div>

  <button id="sos-button" class="sos-btn hidden">🆘</button>

  <div id="photo-lightbox" class="lightbox hidden">
    <span class="lightbox-close">✕</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>设置</h2>
      <button id="close-settings" class="btn-close">✕</button>
      <div class="settings-tabs" id="settings-tabs"></div>
      <div id="settings-form"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/greeting.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/period.js"></script>
  <script src="js/puppy.js"></script>
  <script src="js/fortune.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/diary.js"></script>
  <script src="js/sos.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
