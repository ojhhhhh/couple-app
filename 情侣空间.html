<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF5F0">
<title>情侣空间 · 小窝</title>
<style>
/* ═══════════════════════════════════════════════
   CSS Variables & Reset
   ═══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF9F5;--card-bg:#FFFCF8;--text:#5C3B2E;--text-sub:#A08878;
  --accent:#F0B4B4;--accent-strong:#E89090;--pink:#F9C5C5;--pink-deep:#E8A0A0;
  --boy-color:#8BA4C7;--girl-color:#F0A8B0;--heart:#E87878;
  --radius:16px;--radius-sm:10px;
  --font:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  max-width:480px;margin:0 auto;min-height:100dvh;
  position:relative;overflow-x:hidden;
  background-image:
    radial-gradient(circle at 20% 10%,rgba(240,180,180,0.12) 0%,transparent 50%),
    radial-gradient(circle at 80% 90%,rgba(200,180,220,0.1) 0%,transparent 50%),
    linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 19px,rgba(240,220,210,0.25) 20px),
    linear-gradient(90deg,rgba(200,40,40,0.04) 0%,rgba(200,40,40,0.04) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,100% 20px,100% 100%;
}

/* Auth Screen */
#auth-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:2rem;text-align:center;
}
#auth-screen.hidden{display:none}
.auth-icon{font-size:5rem;margin-bottom:1rem;animation:authBounce 2s ease infinite}
@keyframes authBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.auth-title{font-size:1.6rem;font-weight:700;color:var(--text);margin-bottom:0.4rem}
.auth-sub{font-size:0.9rem;color:var(--text-sub);margin-bottom:1.8rem}
.auth-btn{
  display:block;width:100%;max-width:260px;margin:0.5rem auto;padding:16px 24px;
  border:none;border-radius:999px;font-size:1.1rem;font-weight:650;cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s;letter-spacing:1px;
}
.auth-btn:active{transform:scale(0.96)}
.auth-btn.boy{background:linear-gradient(135deg,#8BA4C7,#6B8DB8);color:#fff;box-shadow:0 4px 18px rgba(107,141,184,0.35)}
.auth-btn.girl{background:linear-gradient(135deg,#F0A8B0,#E88898);color:#fff;box-shadow:0 4px 18px rgba(232,136,152,0.35)}
.auth-pair{display:none;margin-top:1.2rem}
.auth-pair.active{display:block}
.auth-pair input{
  width:180px;padding:12px 16px;border:2px solid #e8d8d0;border-radius:999px;
  font-size:1.1rem;text-align:center;letter-spacing:4px;font-weight:700;
  background:var(--card-bg);outline:none;transition:border-color 0.2s;
}
.auth-pair input:focus{border-color:var(--accent-strong)}
.auth-pair button{
  display:block;margin:12px auto 0;padding:10px 32px;border:none;
  border-radius:999px;background:var(--heart);color:#fff;font-size:1rem;
  cursor:pointer;font-weight:600;
}
.pair-code-display{
  margin-top:1rem;padding:14px 24px;background:var(--card-bg);border-radius:var(--radius);
  border:2px dashed var(--accent-strong);display:inline-block;
}
.pair-code-display .code{font-size:2rem;font-weight:800;letter-spacing:6px;color:var(--heart)}
.pair-code-display .hint{font-size:0.8rem;color:var(--text-sub);margin-top:4px}

/* Partner Bar */
#partner-bar{
  display:none;align-items:center;gap:10px;padding:10px 16px;
  background:var(--card-bg);border-bottom:1px solid #f0e8e0;
  font-size:0.85rem;position:sticky;top:0;z-index:100;
}
#partner-bar.active{display:flex}
#partner-bar .online-dot{
  width:9px;height:9px;border-radius:50%;background:#ccc;flex-shrink:0;
  transition:background 0.4s;
}
#partner-bar .online-dot.live{background:#6BC070;box-shadow:0 0 6px rgba(107,192,112,0.5)}
#partner-bar .partner-name{font-weight:650;flex:1}
#partner-bar .partner-mood{font-size:1.2rem}

/* Hero */
#hero{padding:18px 18px 12px;text-align:center;transition:background 0.5s}
#hero.hero-morning{background:linear-gradient(180deg,#FFF8E7,#FFF9F5)}
#hero.hero-day{background:linear-gradient(180deg,#FFFCF5,#FFF9F5)}
#hero.hero-evening{background:linear-gradient(180deg,#FFF5F0,#FFF9F5)}
#hero.hero-night{background:linear-gradient(180deg,#F5F0F8,#FFF9F5)}
#hero.hero-late{background:linear-gradient(180deg,#F0E8F4,#FFF9F5)}
#greeting-text{font-size:1.2rem;font-weight:650;margin-bottom:8px}
#weather-card{font-size:0.82rem;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.weather-tip{width:100%;font-size:0.78rem;color:var(--accent-strong);margin-top:2px}

/* Puppy Zone */
#puppy-zone{position:relative;text-align:center;padding:4px 0 16px;min-height:160px}
#puppy-img{width:140px;cursor:grab;transition:transform 0.1s;user-select:none;-webkit-user-drag:none}
#puppy-img.dragging{cursor:grabbing;transform:scale(1.08)}
#puppy-speech{
  display:inline-block;position:relative;background:var(--card-bg);color:var(--text);
  padding:8px 16px;border-radius:18px;font-size:0.9rem;margin-bottom:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);opacity:0;transform:translateY(8px);
  transition:opacity 0.25s,transform 0.25s;pointer-events:none;
}
#puppy-speech.show{opacity:1;transform:translateY(0)}
#puppy-speech::after{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:6px solid var(--card-bg);
}
.heart-particle{
  position:absolute;pointer-events:none;font-size:1.5rem;
  animation:heartFloat 1.2s ease-out forwards;z-index:50;
}
@keyframes heartFloat{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-60px) scale(0.5)}
}

/* Card */
.card{
  background:var(--card-bg);border-radius:var(--radius);margin:8px 14px 12px;
  padding:16px;position:relative;box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.card h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* Fortune */
.fortune-result-card{padding:14px;border-radius:var(--radius-sm);text-align:center}
@keyframes fortuneAppear{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

/* Lottery Reward */
.lottery-reward-card{
  background:linear-gradient(135deg,#FFFCF6 0%,#FFF0F5 100%);border-radius:12px;
  padding:14px;margin:8px 0;text-align:center;
  border:2px dashed #F9C5C5;animation:rewardPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes rewardPop{0%{opacity:0;transform:scale(0.85)}100%{opacity:1;transform:scale(1)}}
.lottery-reward-content{font-size:1.1em;line-height:1.7;color:#5C3B2E;font-weight:500;}
.lottery-reward-tier{font-size:0.9rem;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.lottery-reward-name{font-size:1.05rem;font-weight:700;color:#5C3B2E;margin-bottom:4px;}
.lottery-reward-desc{font-size:0.88rem;color:#8B7E74;line-height:1.5;}
.lottery-claimed-badge{
  display:inline-block;margin-top:8px;padding:8px 20px;
  background:#e8e8e8;color:#888;border-radius:999px;font-size:0.9rem;font-weight:650;
}
.lottery-claim-btn{transition:all 0.2s ease;}
.lottery-claim-btn:hover{transform:scale(1.04);box-shadow:0 6px 20px rgba(0,0,0,0.18)!important;}
.lottery-claim-btn:active{transform:scale(0.95);}

/* Enhanced Card Styles */
.card{
  box-shadow:0 2px 12px rgba(0,0,0,0.05),0 0 0 1px rgba(0,0,0,0.02);
  transition:box-shadow 0.3s,transform 0.2s;
}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.03);}

/* Puppy Decorations */
.puppy-paw{
  position:absolute;font-size:1.2rem;opacity:0.15;pointer-events:none;
  animation:pawFloat 3s ease-in-out infinite;
}
@keyframes pawFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(10deg)}}
.puppy-bone{
  display:inline-block;font-size:0.9rem;opacity:0.4;margin:0 2px;
}
.card h3 .puppy-icon{
  display:inline-block;animation:puppyWiggle 2s ease-in-out infinite;
}
@keyframes puppyWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* Enhanced Auth Screen */
.auth-icon{font-size:6rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1));}
.auth-btn{
  transition:transform 0.2s,box-shadow 0.2s,filter 0.2s;
}
.auth-btn:hover{filter:brightness(1.05);}

/* Puppy Zone Enhancements */
#puppy-zone{
  background:radial-gradient(ellipse at center,rgba(240,180,180,0.08) 0%,transparent 70%);
  border-radius:var(--radius);margin:0 8px;
}
#puppy-speech{
  background:linear-gradient(135deg,#FFFCF8,#FFF5F0);
  border:1px solid rgba(240,180,180,0.2);
}

/* Improved SOS button */
#sos-button{
  animation:sosPulseNew 2.5s ease infinite;
}
@keyframes sosPulseNew{
  0%,100%{box-shadow:0 4px 16px rgba(200,40,40,0.4)}
  50%{box-shadow:0 4px 32px rgba(200,40,40,0.7),0 0 0 14px rgba(200,40,40,0.08)}
}

/* Paw print background pattern */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0.03;
  background-image:
    radial-gradient(circle at 15% 20%,#C08060 1px,transparent 1px),
    radial-gradient(circle at 15% 20%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 12% 18%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 18% 18%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 75% 45%,#C08060 1px,transparent 1px),
    radial-gradient(circle at 75% 45%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 72% 43%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 78% 43%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 50% 75%,#C08060 1px,transparent 1px),
    radial-gradient(circle at 50% 75%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 47% 73%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 53% 73%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 30% 85%,#C08060 1px,transparent 1px),
    radial-gradient(circle at 30% 85%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 27% 83%,#C08060 2px,transparent 2px),
    radial-gradient(circle at 33% 83%,#C08060 2px,transparent 2px);
  background-size:300px 300px,300px 300px,300px 300px,300px 300px,
    300px 300px,300px 300px,300px 300px,300px 300px,
    300px 300px,300px 300px,300px 300px,300px 300px,
    300px 300px,300px 300px,300px 300px,300px 300px;
  background-position:
    10% 15%,10% 15%,10% 15%,10% 15%,
    80% 50%,80% 50%,80% 50%,80% 50%,
    45% 70%,45% 70%,45% 70%,45% 70%,
    25% 88%,25% 88%,25% 88%,25% 88%;
}

/* Schedule */
.course-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5ece5}
.course-item:last-child{border-bottom:none}
.course-item.active{background:rgba(240,180,180,0.1);margin:0 -8px;padding:8px;border-radius:8px}
.course-name{font-weight:650;font-size:0.92rem}
.course-info{font-size:0.78rem;color:var(--text-sub)}
.course-time{font-size:0.82rem;font-weight:600;color:var(--accent-strong)}
.no-course{text-align:center;color:var(--text-sub);font-size:0.9rem;padding:8px 0}

/* Period */
.period-phase{font-size:0.9rem;margin-bottom:4px}
.period-next{font-size:0.82rem;color:var(--text-sub)}
.period-calendar{
  display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  text-align:center;font-size:0.78rem;margin-top:10px;padding:6px;
  background:rgba(0,0,0,0.02);border-radius:8px;
}
.cal-header{font-weight:650;padding:4px 0;color:var(--text-sub);font-size:0.72rem}
.cal-day{padding:5px 2px;border-radius:4px}
.cal-day.other-month{color:#ddd}
.cal-day.today{background:rgba(240,180,180,0.2);font-weight:700}
.cal-day.period-day{background:rgba(240,130,130,0.25);border-radius:50%;font-weight:700;color:#D04040}
.cal-day.predicted-day{background:rgba(240,160,80,0.2);border-radius:50%;font-weight:700;color:#D08040}

/* Exam */
.exam-item{padding:10px 0;border-bottom:1px solid #f5ece5;cursor:pointer}
.exam-item:last-child{border-bottom:none}
.exam-subject{font-weight:650;font-size:0.92rem}
.exam-countdown{font-size:0.8rem;font-weight:650;padding:3px 10px;border-radius:12px;display:inline-block}
.exam-countdown.urgent{background:#FFE8E8;color:#D04040}
.exam-countdown.mid{background:#FFF4E0;color:#D08040}
.exam-countdown.safe{background:#E8F4E8;color:#5B9060}
.exam-tasks{margin-top:8px;padding-left:8px;display:none}
.exam-tasks.open{display:block}
.exam-progress{height:4px;background:#f0e8e0;border-radius:2px;margin-top:6px;overflow:hidden}
.exam-progress-bar{height:100%;background:var(--accent-strong);border-radius:2px;transition:width 0.3s}

/* Diary */
.diary-form textarea{
  width:100%;padding:12px;border:1px solid #f0e5dc;border-radius:var(--radius-sm);
  font-size:0.9rem;font-family:var(--font);resize:vertical;min-height:70px;
  background:var(--card-bg);outline:none;
}
.diary-form textarea:focus{border-color:var(--accent-strong)}
.diary-moods{display:flex;gap:8px;margin:8px 0}
.diary-mood-btn{
  padding:6px 14px;border:2px solid #f0e5dc;border-radius:999px;
  background:var(--card-bg);cursor:pointer;font-size:1.1rem;transition:all 0.15s;
}
.diary-mood-btn.selected{border-color:var(--accent-strong);background:rgba(240,180,180,0.15);transform:scale(1.08)}
.diary-actions{display:flex;gap:8px;justify-content:flex-end}
.diary-actions button{
  padding:8px 18px;border:none;border-radius:999px;font-size:0.85rem;
  cursor:pointer;font-weight:600;
}
.diary-entry{
  margin-top:8px;padding:10px;border-radius:var(--radius-sm);
  border-left:3px solid #ddd;background:rgba(0,0,0,0.01);
}
.diary-entry.happy{border-left-color:#F0A8B0}
.diary-entry.normal{border-left-color:#C0C0C0}
.diary-entry.sad{border-left-color:#8BA4C7}
.diary-content{font-size:0.88rem;line-height:1.5}
.diary-meta{font-size:0.75rem;color:var(--text-sub);margin-top:4px;display:flex;justify-content:space-between}
.diary-reply{font-size:0.8rem;color:var(--accent-strong);font-style:italic;margin-top:4px}

/* Photo */
.photo-grid{columns:2;column-gap:8px;margin-top:8px}
.photo-item{break-inside:avoid;margin-bottom:8px;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;position:relative}
.photo-item img{width:100%;display:block;border-radius:var(--radius-sm)}
.photo-caption{font-size:0.75rem;padding:4px 8px;color:var(--text-sub);text-align:center}
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9998;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
}
.lightbox.hidden{display:none}
.lightbox img{max-width:95%;max-height:70vh;border-radius:8px}
.lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:2rem;cursor:pointer}

/* SOS */
#sos-button{
  position:fixed;bottom:80px;right:16px;width:56px;height:56px;
  border-radius:50%;background:linear-gradient(135deg,#E84040,#C02020);
  border:none;color:#fff;font-size:1.4rem;cursor:pointer;
  box-shadow:0 4px 16px rgba(200,40,40,0.4);z-index:200;
  animation:sosPulse 2s ease infinite;display:none;
}
#sos-button.visible{display:flex;align-items:center;justify-content:center}
@keyframes sosPulse{0%,100%{box-shadow:0 4px 16px rgba(200,40,40,0.4)}50%{box-shadow:0 4px 28px rgba(200,40,40,0.7),0 0 0 12px rgba(200,40,40,0.1)}}
.sos-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9997;
  display:flex;align-items:center;justify-content:center;
}
.sos-modal{
  background:var(--card-bg);border-radius:var(--radius);padding:24px;
  text-align:center;max-width:300px;width:90%;
}

/* Toast */
#notify-toast{
  position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-120px);
  background:var(--text);color:#fff;padding:12px 24px;border-radius:999px;
  font-size:0.85rem;z-index:9999;transition:transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
  max-width:90%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
#notify-toast.show{transform:translateX(-50%) translateY(0)}

/* Settings Modal */
.settings-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9996;
  display:flex;align-items:flex-end;justify-content:center;
}
.settings-overlay.hidden{display:none}
.settings-modal{
  background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:480px;
  max-height:82dvh;overflow-y:auto;padding:20px 16px 32px;
  animation:slideUp 0.3s ease-out;
}
@keyframes slideUp{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.settings-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.settings-tab{
  padding:6px 14px;border-radius:999px;border:1.5px solid #e8d8d0;
  background:transparent;cursor:pointer;font-size:0.82rem;white-space:nowrap;
  transition:all 0.15s;
}
.settings-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.settings-section h3{font-size:1rem;margin-bottom:10px}
.settings-row{display:flex;gap:8px;margin-bottom:8px}
.settings-row input,.settings-row select{
  flex:1;padding:10px 12px;border:1px solid #e8d8d0;border-radius:8px;
  font-size:0.88rem;background:var(--card-bg);outline:none;
}
.settings-row button{
  padding:10px 16px;background:var(--accent);color:#fff;border:none;
  border-radius:8px;font-weight:650;cursor:pointer;white-space:nowrap;
}
.symptom-list{display:flex;gap:6px;flex-wrap:wrap}
.symptom-chip{
  padding:5px 12px;border:1px solid #e8d8d0;border-radius:999px;font-size:0.78rem;
  cursor:pointer;transition:all 0.15s;
}
.symptom-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Public cards */
.wishlist-item,.together-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid #f5ece5;font-size:0.88rem;
}
.wishlist-item .check,.together-item .check{
  width:22px;height:22px;border:2px solid #ddd;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;flex-shrink:0;transition:all 0.15s;
}
.wishlist-item .check.done,.together-item .check.done{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.wishlist-item .text,.together-item .text{flex:1}
.wishlist-item .text.done,.together-item .text.done{text-decoration:line-through;color:var(--text-sub)}

.anniversary-countdown{text-align:center;font-size:1.2rem;font-weight:700;color:var(--heart)}
.anniversary-label{text-align:center;font-size:0.85rem;color:var(--text-sub);margin-bottom:4px}

/* Partner fortune */
.partner-fortune{margin-top:10px;padding:10px;background:rgba(240,180,180,0.08);border-radius:var(--radius-sm)}
.partner-fortune-label{font-size:0.78rem;color:var(--text-sub);margin-bottom:4px}

/* Footer */
footer{text-align:center;padding:20px 0 30px;font-size:0.78rem;color:var(--text-sub)}
footer button{
  padding:8px 20px;border:1.5px solid #e8d8d0;border-radius:999px;
  background:var(--card-bg);font-size:0.85rem;cursor:pointer;color:var(--text);
  transition:all 0.15s;
}
footer button:active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Share toggle */
.share-toggle{
  display:inline-flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-sub);
  cursor:pointer;margin-left:auto;
}
.share-toggle .dot{width:8px;height:8px;border-radius:50%;background:#ccc;transition:background 0.2s}

/* Misc */

/* ═══════════════════════════════════════════════
   线条小狗 Kawaii 美化系统
   ═══════════════════════════════════════════════ */

/* -- Extended Kawaii Palette -- */
:root{
  --kawaii-pink:#FFD1DC;--kawaii-lavender:#E8D5F5;--kawaii-mint:#D4F0E8;
  --kawaii-peach:#FFE4D0;--kawaii-sky:#D6EAF8;--kawaii-lemon:#FFF6D5;
  --kawaii-rose:#FFD4D4;--kawaii-lilac:#EDE0F5;--kawaii-coral:#FFD9D0;
  --kawaii-cream:#FFFBF5;--kawaii-cocoa:#C8A896;
  --deco-opacity:0.18;
}

/* -- Sakura Petal Fall -- */
.sakura-container{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sakura-petal{
  position:absolute;top:-60px;animation:sakuraFall linear infinite;
  opacity:0.5;font-size:1.2rem;filter:blur(0.5px);
}
@keyframes sakuraFall{
  0%{transform:translateY(-5vh) rotate(0deg) translateX(0);opacity:0.55}
  25%{transform:translateY(25vh) rotate(90deg) translateX(30px);opacity:0.45}
  50%{transform:translateY(50vh) rotate(180deg) translateX(-20px);opacity:0.5}
  75%{transform:translateY(75vh) rotate(270deg) translateX(25px);opacity:0.4}
  100%{transform:translateY(105vh) rotate(360deg) translateX(-15px);opacity:0.2}
}

/* -- Floating Kawaii Deco -- */
.kawaii-float{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.kawaii-bubble{
  position:absolute;bottom:-60px;animation:bubbleRise linear infinite;
  opacity:0.3;font-size:1rem;
}
@keyframes bubbleRise{
  0%{transform:translateY(0) translateX(0) scale(0.6);opacity:0.35}
  30%{opacity:0.3}
  70%{opacity:0.2}
  100%{transform:translateY(-110vh) translateX(60px) scale(1.1);opacity:0}
}

/* -- Cursor Trail Hearts -- */
.heart-trail{
  position:fixed;pointer-events:none;z-index:9999;
  animation:heartTrail 0.7s ease-out forwards;
  font-size:1.1rem;
}
@keyframes heartTrail{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-45px) scale(0.2) rotate(20deg)}
}

/* -- Card Deco Borders -- */
.card::before{
  content:'';position:absolute;top:6px;left:10px;right:10px;height:2px;
  background:repeating-linear-gradient(90deg,var(--kawaii-pink) 0px,var(--kawaii-pink) 6px,transparent 6px,transparent 12px);
  border-radius:2px;opacity:0.5;z-index:1;
}
.card::after{
  content:'';position:absolute;bottom:6px;left:10px;right:10px;height:2px;
  background:repeating-linear-gradient(90deg,var(--kawaii-lavender) 0px,var(--kawaii-lavender) 6px,transparent 6px,transparent 12px);
  border-radius:2px;opacity:0.5;z-index:1;
}

/* -- Washi Tape Corner -- */
.washi-corner{
  position:absolute;top:-4px;right:12px;width:30px;height:18px;
  background:var(--kawaii-pink);opacity:0.7;border-radius:2px;
  transform:rotate(8deg);z-index:2;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}

/* -- Ribbon Bow Decoration -- */
.ribbon-bow{
  display:inline-block;position:relative;font-size:1.3rem;
  animation:bowBounce 2.5s ease-in-out infinite;
}
@keyframes bowBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* -- Glowing Heart -- */
.glowing-heart{
  display:inline-block;
  animation:glowPulse 1.8s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{filter:drop-shadow(0 0 3px rgba(232,120,120,0.5))}
  50%{filter:drop-shadow(0 0 8px rgba(232,120,120,0.8))}
}

/* -- Title Sparkle -- */
.sparkle-star{
  position:absolute;pointer-events:none;opacity:0;
  animation:starTwinkle 1.5s ease-in-out infinite;
  font-size:0.7rem;
}
@keyframes starTwinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:0.9;transform:scale(1.3)}
}

/* -- Shimmer Text Effect -- */
.shimmer-text{
  background:linear-gradient(90deg,var(--text),var(--accent-strong),var(--pink-deep),var(--text));
  background-size:300% 100%;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* -- Wavy Divider -- */
.wavy-divider{

/* -- Bouncy Button -- */
.bouncy-btn:active{animation:btnBounce 0.3s ease}
@keyframes btnBounce{0%{transform:scale(1)}40%{transform:scale(0.88)}70%{transform:scale(1.04)}100%{transform:scale(1)}}

/* -- Rainbow Border Glow for special cards -- */
.card.magic-glow{

}
@keyframes magicGlow{
  0%,100%{box-shadow:0 2px 12px rgba(240,180,180,0.15),0 0 0 1px rgba(240,180,180,0.1)}

  66%{box-shadow:0 2px 12px rgba(180,220,240,0.2),0 0 0 1px rgba(180,220,240,0.15)}
}

/* -- Kawaii Scrollbar -- */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--kawaii-cream)}
::-webkit-scrollbar-thumb{background:var(--kawaii-pink);border-radius:3px}

/* -- Ringing Notification Bell -- */
.notif-bell{display:inline-block;animation:bellRing 0.6s ease-in-out infinite;animation-play-state:paused}
.notif-bell.active{animation-play-state:running}
@keyframes bellRing{

  40%{transform:rotate(-15deg)}

/* -- Decorated HR / Separator -- */

  color:var(--text-sub);opacity:0.5;user-select:none;
}

/* -- Kawaii Swirl Background -- */
.swirl-bg{
  position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:0.03;
  background:
    radial-gradient(ellipse at 15% 25%,#F0B4B4 0%,transparent 60%),
    radial-gradient(ellipse at 85% 40%,#C8B4E0 0%,transparent 60%),
    radial-gradient(ellipse at 50% 70%,#B4D4E0 0%,transparent 60%),

/* -- Stamp/Seal Effect -- */
.stamp-seal{
  display:inline-flex;align-items:center;justify-content:center;

/* -- Decoration String (garland) -- */

  font-size:0.6rem;letter-spacing:2px;opacity:0.55;user-select:none;

/* -- Tilt on Hover for Cards -- */
@media(hover:hover){
  .card.tilt:hover{transform:rotate(-0.3deg) scale(1.01);transition:transform 0.3s}

/* -- Confetti Pop -- */
.confetti-piece{

  animation:confettiBurst 1.2s ease-out forwards;
  font-size:1rem;
}
@keyframes confettiBurst{

/* -- Notification Badge with wiggle -- */

}
@keyframes badgeWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}

/* -- Kawaii Loading Skeleton -- */
.skeleton-pulse{
  animation:skeletonShimmer 1.6s ease-in-out infinite;
  background:linear-gradient(90deg,var(--kawaii-pink) 0%,var(--kawaii-cream) 40%,var(--kawaii-pink) 80%);

}
@keyframes skeletonShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* -- Petal Decorative Border for special cards -- */
.petal-border{

}
.petal-border::before{

/* -- Heart Decorative Border -- */

/* -- Button Group Sparkle Container -- */
.btn-sparkle-wrap{position:relative;display:inline-block}

@keyframes btnSparklePop{0%,100%{opacity:0;transform:translate(0,0) scale(0)}50%{opacity:0.9;transform:translate(var(--sx),var(--sy)) scale(1)}}

/* -- Toast with sparkle -- */
#notify-toast.sparkle-toast{

/* -- Moon & Star decorative -- */

/* -- Cute Tag / Label Pill -- */

/* -- Dotted Line Decoration -- */

/* -- Envelope seal heart -- */

/* -- Greeting Card effect -- */
.greeting-card{

/* -- Puppy Paw Loading -- */

@keyframes pawStep{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ========== End Kawaii System ========== */
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   情侣空间 · 完整应用逻辑
   ═══════════════════════════════════════════════════════════════ */
/* ========== Globals ========== */
let myRole, partnerUid, partnerRole;
const ROLE_LABEL = { boyfriend:'小宇', girlfriend:'小鱼' };
const ROLE_EMOJI = { boyfriend:'💙', girlfriend:'💗' };

/* ========== Storage Fallback ========== */
const LS = {
  get(k, fb){ try{ const v=localStorage.getItem('couple_'+k); return v?JSON.parse(v):fb; }catch{return fb} },
  set(k,v){ try{ localStorage.setItem('couple_'+k, JSON.stringify(v)); }catch(e){console.warn('LS set fail',e)} },
  remove(k){ localStorage.removeItem('couple_'+k) }
};

/* ========== Auth ========== */
const Auth = {
  async init(){
    // Use myUid from api.js (generated from localStorage, no auth needed)
    myRole=LS.get('role',null);
    if(!myRole){ this.showRoleSelect(); return; }
    await Sync.initMyData();
    partnerUid=LS.get('partnerUid',null);
    if(!partnerUid){ this.showPairScreen(); return; }
    await Sync.listenPartner();
    LS.set('partnerUid',partnerUid);
    this.showMainApp();
  },

  showRoleSelect(){
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('auth-pair-create').classList.remove('active');
    document.getElementById('auth-pair-join').classList.remove('active');
  },

  async chooseRole(role){
    myRole=role;
    partnerRole=role==='boyfriend'?'girlfriend':'boyfriend';
    LS.set('role',role);
    await safeFBAsync(()=>firebase.database().ref('users/'+myUid+'/role').set(role));
    this.showPairScreen();
  },

  async showPairScreen(){
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('auth-pair-create').classList.add('active');
    document.getElementById('auth-pair-join').classList.add('active');

    // Show my pair code
    const pairCode=LS.get('pairCode',null) || String(Math.floor(100000+Math.random()*900000));
    LS.set('pairCode',pairCode);
    document.getElementById('my-pair-code').textContent=pairCode;

    // Write pair code to Firebase (offline-safe)
    await safeFBAsync(async()=>{
      const ref=firebase.database().ref('pairs/'+pairCode);
      const existing=await (await ref.get()).val();
      if(!existing){
        const data={created:Date.now()};
        data[myRole+'Uid']=myUid;
        await ref.set(data);
      }else if(!existing[myRole+'Uid'] || existing[myRole+'Uid']===myUid){
        existing[myRole+'Uid']=myUid;
        await ref.set(existing);
      }
    })
  },

  async joinPair(){
    const code=document.getElementById('pair-code-input').value.trim();
    if(code.length!==6){ alert('请输入6位配对码'); return; }
    const otherRole=myRole==='boyfriend'?'girlfriend':'boyfriend';
    LS.set('pairCode',code);
    try{
      // Check if pair exists on server
      const snap=await firebase.database().ref('pairs/'+code).get();
      const data=snap.val();
      if(!data){ alert('配对码无效，请检查后重试'); return; }
      const otherUid=data[otherRole+'Uid'];
      if(!otherUid){ alert('另一半还没连接，请等TA先打开应用'); return; }
      // Both sides registered — link them
      partnerUid=otherUid;
      LS.set('partnerUid',partnerUid);
      await firebase.database().ref('users/'+myUid+'/partnerUid').set(partnerUid);
      await firebase.database().ref('users/'+partnerUid+'/partnerUid').set(myUid);
      // Add my uid to the pair
      data[myRole+'Uid']=myUid;
      await firebase.database().ref('pairs/'+code).set(data);
    }catch(e){
      // Backend unreachable — use localStorage only
      console.warn('Backend unreachable, offline mode:',e.message);
      partnerUid='partner_'+code;
      LS.set('partnerUid',partnerUid);
    }
    if(!partnerUid) return;
    await Sync.listenPartner();
    KawaiiDeco.celebrate();
    this.showMainApp();
  },

  showMainApp(){
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('partner-bar').classList.add('active');
    App.init();
  }
};

/* ========== Sync Layer ========== */
const Sync = {
  async initMyData(){
    // Ensure role exists in Firebase
    const roleSnap=await firebase.database().ref('users/'+myUid+'/role').get();
    if(!roleSnap.val()) await firebase.database().ref('users/'+myUid+'/role').set(myRole);
    // Read partnerUid from Firebase
    const pSnap=await firebase.database().ref('users/'+myUid+'/partnerUid').get();
    if(pSnap.val()){ partnerUid=pSnap.val(); LS.set('partnerUid',partnerUid); }
  },

  async listenPartner(){
    if(!partnerUid) return;
    // Listen partner status
    firebase.database().ref('users/'+partnerUid+'/status').on('value',snap=>{
      const s=snap.val();
      if(s){
        const dot=document.getElementById('partner-dot');
        if(s.online) dot.classList.add('live'); else dot.classList.remove('live');
        document.getElementById('partner-status-text').textContent=s.online?'在线':(s.lastSeen?this._timeAgo(s.lastSeen):'离线');
      }
    });
    // Listen partner mood
    firebase.database().ref('users/'+partnerUid+'/mood').on('value',snap=>{
      const m=snap.val();
      if(m) document.getElementById('partner-mood').textContent=m;
    });
    // Listen partner name
    firebase.database().ref('users/'+partnerUid+'/role').on('value',snap=>{
      const r=snap.val();
      if(r) document.getElementById('partner-name').textContent=(ROLE_EMOJI[r]||'')+' '+ROLE_LABEL[r];
    });
    // Listen partner data changes for real-time refresh
    firebase.database().ref('users/'+partnerUid).on('value',snap=>{
      if(snap.val()) App.refreshPartnerData();
    });
    // Listen public changes
    firebase.database().ref('public').on('value',snap=>{
      App.refreshPublicData();
    });
  },

  _timeAgo(ts){
    const s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return '刚刚';
    if(s<3600) return Math.floor(s/60)+'分钟前';
    if(s<86400) return Math.floor(s/3600)+'小时前';
    return Math.floor(s/86400)+'天前';
  },

  // Write my data
  async setMyData(path,value){
    LS.set('my_'+path.replace('/','_'),value);
    try{ await firebase.database().ref('users/'+myUid+'/'+path).set(value); }
    catch(e){ console.warn('FB write fail:',e); }
  },

  // Write public data
  async pushPublic(path,value){
    try{ return await firebase.database().ref('public/'+path).push(value); }
    catch(e){ console.warn('FB public write fail:',e); return null; }
  },
  async setPublic(path,value){
    try{ await firebase.database().ref('public/'+path).set(value); }
    catch(e){ console.warn('FB public set fail:',e); }
  },

  // Read my data from Firebase + merge to localStorage
  async loadMyData(path,fallback){
    try{
      const snap=await firebase.database().ref('users/'+myUid+'/'+path).get();
      const fbVal=snap.val();
      if(fbVal!==null && fbVal!==undefined){ LS.set('my_'+path.replace('/','_'),fbVal); return fbVal; }
    }catch(e){ console.warn('FB read fail for '+path,e); }
    // Fallback to localStorage
    const lsVal=LS.get('my_'+path.replace('/','_'),null);
    if(lsVal!==null) return lsVal;
    return typeof fallback==='function'?fallback():fallback;
  },

  // Get partner data
  async loadPartnerData(path,fallback){
    if(!partnerUid) return fallback;
    try{
      const snap=await firebase.database().ref('users/'+partnerUid+'/'+path).get();
      const val=snap.val();
      return val!==null&&val!==undefined?val:fallback;
    }catch(e){ return fallback; }
  },

  // Update online status (REST polling)
  async updateOnline(){
    if(!myUid) return;
    Sync.setMyData('status', {online:true, lastSeen:Date.now()});
    setInterval(() => {
      Sync.setMyData('status', {online:true, lastSeen:Date.now()});
    }, 30000);
    // Mark offline on page unload
    window.addEventListener('beforeunload', () => {
      navigator.sendBeacon(API_BASE + '/api/users/' + myUid + '/status', JSON.stringify({online:false, lastSeen:Date.now()}));
    });
  }
};

alth:'身体无大碍。选自己更能坚持的养生方案。'}},{id:10,level:'中签',poem:'船到桥头水自直，何须苦苦用心机。\n随缘任运逍遥过，春去秋来总有时。',allusion:'「庄子逍遥游」—— 庄周梦蝶，物我两忘。顺应自然，不强求。',oracle:{overall:'顺其自然之兆！有些事情强求不得。',career:'不必给自己太大压力。尽力而为即可。',love:'缘分强求不来。给彼此空间。',health:'良好作息比补药重要。保持平常心。'}},{id:11,level:'中签',poem:'云横秦岭家何在，雪拥蓝关马不前。\n且待天晴冰雪化，青山依旧笑开颜。',allusion:'「韩愈贬潮州」—— 韩愈谏迎佛骨被贬潮州，终得昭雪还朝。',oracle:{overall:'暂受阻隔之兆！不是终点，只是中场休息。',career:'学业事业暂时停滞。利用这段时间充电。',love:'感情进入平淡期。距离产生美。',health:'近期容易疲劳，需要好好休息。'}},{id:12,level:'中签',poem:'一盏寒灯照夜窗，十年辛苦读文章。\n功名不是朝夕事，水到渠成自放光。',allusion:'「范进中举」—— 范进屡试不第，坚持不辍，终在年老时中举。',oracle:{overall:'厚积薄发之兆！成功需要时间积累。',career:'学习需持之以恒。看似进展缓慢，实则根基渐固。',love:'好的缘分值得等待。提升自己是最好的准备。',health:'注意用眼和颈椎。长时间伏案要适当活动。'}},{id:13,level:'中签',poem:'蜻蜓点水过莲塘，浅浅深深各自忙。\n莫学蜻蜓轻点过，深耕一片自然香。',allusion:'「庖丁解牛」—— 庖丁专注解牛十九年，刀法入神。专注一事，必臻化境。',oracle:{overall:'戒浮戒躁之兆！做事不可蜻蜓点水。',career:'学业上需专注重点，不宜贪多。',love:'感情需用心经营，不可三心二意。',health:'专注一两项运动或养生方式即可。'}},{id:14,level:'中签',poem:'山高路远日悠悠，一步一印莫回头。\n行到水穷云起处，方知天地为君留。',allusion:'「玄奘西行」—— 唐僧玄奘孤身西行五万里，历经八十一难。',oracle:{overall:'脚踏实地之兆！目标虽远，一步一步走总能到达。',career:'学习是一场马拉松。稳扎稳打的人最终胜出。',love:'长期关系靠经营而非激情。珍惜身边人。',health:'坚持运动比偶尔剧烈锻炼更有益。'}},{id:15,level:'中签',poem:'花开不择富家院，月照何分贵贱人。\n但存方寸菩提心，处处春风处处新。',allusion:'「观音普度」—— 观世音菩萨大慈大悲，不分贵贱，普度众生。',oracle:{overall:'心存善念之兆！好运眷顾善良的人。',career:'乐于助人会有意外回报。互相帮助带来好机会。',love:'善良和温柔是最有吸引力的品质。',health:'心怀善念者往往更健康。'}},{id:16,level:'中签',poem:'棋逢对手局初开，胜负输赢未可猜。\n但尽己能无憾事，输赢都是好安排。',allusion:'「谢安围棋」—— 淝水之战时谢安与客下棋，闻捷报而不动声色。',oracle:{overall:'竞争之兆！全力以赴即无愧。',career:'考试或评比中放平心态。对手也是磨刀石。',love:'感情不是比赛，不要计较谁付出更多。',health:'身心状态平衡就好。不必和他人比较。'}},{id:17,level:'中签',poem:'落叶满阶红不扫，秋深犹有菊花香。\n繁华落尽见真淳，简简单单福更长。',allusion:'「刘禹锡陋室铭」—— 山不在高，有仙则名。斯是陋室，惟吾德馨。',oracle:{overall:'返璞归真之兆！简单生活有简单的快乐。',career:'学好基础比追求技巧更重要。',love:'最简单的浪漫最动人。一杯热水、一句问候。',health:'简单的生活方式最养生。'}},{id:20,level:'中签',poem:'种豆得豆理当然，种瓜岂望得芝兰。\n劝君多种菩提子，善果盈盈满玉盘。',allusion:'「了凡四训」—— 袁了凡通过积德行善改变命运，得子延寿。',oracle:{overall:'因果不爽之兆！种什么因得什么果。',career:'学习成绩反映付出的努力。没有捷径。',love:'你怎么对待感情，感情就怎么回报你。',health:'现在开始养生也不晚。'}},{id:21,level:'下签',poem:'浮云蔽日暗重楼，欲渡黄河冰塞舟。\n暂敛锋芒藏锐气，静待东风化解愁。',allusion:'「孔子困陈蔡」—— 孔子周游列国，困于陈蔡之间，绝粮七日。',oracle:{overall:'暂遇阻滞之兆！宜静不宜动，保存实力。',career:'学业事业可能遇到瓶颈。不要气馁。',love:'感情可能有波折。给彼此冷静的空间。',health:'注意身体健康，不要忽视小症状。'}},{id:22,level:'下签',poem:'逆水行舟用力撑，一篙松劲退千寻。\n此时若要停舟歇，恐被江流逐浪沉。',allusion:'「逆水行舟不进则退」—— 学如逆水行舟，不进则退。',oracle:{overall:'不可松懈之兆！现在是关键时期。',career:'学业关键时刻不能掉链子。考试前尤其如此。',love:'感情需要加倍的耐心维护。及时沟通化解。',health:'身体发出疲劳信号时不要硬撑。'}},{id:23,level:'下签',poem:'独坐幽篁弹旧琴，知音稀少恨难禁。\n高山流水终有遇，只是来时未可寻。',allusion:'「伯牙绝弦」—— 伯牙善琴，钟子期死，伯牙以为世无足鼓琴者。',oracle:{overall:'孤独之兆！但宁缺毋滥，这只是暂时的。',career:'学习中可能感到孤立。主动寻求帮助。',love:'可能有孤独感。不要因为寂寞而随意开始。',health:'多与朋友家人交流，倾诉是很好解压方式。'}},{id:24,level:'下签',poem:'秋雨梧桐叶落时，西风吹老旧年枝。\n来年春暖花重发，莫为今朝徒自悲。',allusion:'「黛玉葬花」—— 林黛玉见花落泪，葬花自怜。花开花落本自然。',oracle:{overall:'情绪低落之兆！一切都会过去。',career:'可能遇到小挫折或批评。这只是成长的一部分。',love:'旧情难忘或感情受挫。给自己时间疗伤。',health:'多晒太阳多运动，抑郁会随着汗水排解。'}},{id:25,level:'下签',poem:'树大招风自古然，出头椽木朽当先。\n藏锋敛锐深涵养，不露圭角自泰然。',allusion:'「杨修之死」—— 杨修恃才傲物，被曹操所杀。聪明反被聪明误。',oracle:{overall:'低调为上之兆！韬光养晦，低调行事。',career:'踏实做事比炫耀聪明更能赢得尊重。',love:'感情中低调一些更长久。两个人的甜蜜自己知道就好。',health:'身体没什么大问题。保持低调的养生习惯。'}},{id:26,level:'下签',poem:'大旱望云云不起，枯苗待雨雨来迟。\n天时有待君须耐，莫怨苍天莫怨时。',allusion:'「商汤祈雨」—— 商汤时天下大旱七年，汤以身祷于桑林。',oracle:{overall:'等待忍耐之兆！抱怨无用。耐心等待是最好的策略。',career:'考试成绩或机会可能来得比预期慢。在等待中持续努力。',love:'缘分可能姗姗来迟。最好的总在不经意间到来。',health:'慢性问题需要耐心调理。慢慢来比较快。'}},{id:27,level:'下签',poem:'前路茫茫雾锁江，风波处处险难防。\n小心驶得万年船，步步为营莫逞强。',allusion:'「赤壁之战」—— 曹操百万大军南下，因不习水战而败于赤壁。',oracle:{overall:'谨慎行事之兆！处处需小心，不可大意。',career:'考试前要仔细复习，不能有任何侥幸心理。',love:'言行需谨慎，无心之言可能伤人。',health:'外出注意交通安全。饮食卫生需留心。'}},{id:28,level:'下签',poem:'镜花水月本来空，执念太深反受穷。\n放下心头千斤担，轻舟已过万山重。',allusion:'「金刚经」—— 一切有为法，如梦幻泡影，如露亦如电。',oracle:{overall:'放下执着之兆！有些事放手反而更好。',career:'对成绩或结果的过度执着反而影响发挥。',love:'执念太深伤人伤己。学会放手。',health:'心理压力是健康大敌。学会释怀和放下。'}}],
  _daoLevelKeys:null,_daoCumul:null,_daoTotalWeight:null,

  _ensureCumul(){
    if(this._daoCumul) return;
    this._daoLevelKeys=Object.keys(this._levelWeights);
    this._daoTotalWeight=this._daoLevelKeys.reduce((s,k)=>s+this._levelWeights[k],0);
    let acc=0;
    this._daoCumul=this._daoLevelKeys.map(k=>{acc+=this._levelWeights[k]/this._daoTotalWeight;return acc});
    this._daoCumul[this._daoCumul.length-1]=1;
  },

  drawStick(){
    this._ensureCumul();
    const r=Math.random();
    let level=this._daoLevelKeys[this._daoLevelKeys.length-1];
    for(let i=0;i<this._daoCumul.length;i++){if(r<this._daoCumul[i]){level=this._daoLevelKeys[i];break}}
    const pool=this.sticks.filter(s=>s.level===level);
    return pool[Math.floor(Math.random()*pool.length)];
  },

  isAuspicious(stick){ return stick&&(stick.level==='上上签'||stick.level==='上吉签'); },

  _levelColor(l){ const m={'上上签':'#C9302C','上吉签':'#D4793A','中签':'#6B8E6B','下签':'#5B7B9A'}; return m[l]||'#6B8E6B'; },
  _levelBg(l){ const m={'上上签':'#FFF0ED','上吉签':'#FFF6EE','中签':'#F2F7F0','下签':'#EEF2F6'}; return m[l]||'#F2F7F0'; },

  courses:[],partnerCourses:[],DAY_NAMES:['周日','周一','周二','周三','周四','周五','周六'],

  _parseTime(ts){ if(!ts) return null; const i=ts.indexOf('-'); if(i===-1) return null; const p=ts.slice(0,i).split(':'); if(p.length!==2) return null; const h=parseInt(p[0]),m=parseInt(p[1]); return isNaN(h)||isNaN(m)?null:h*60+m; },

  _jsDay(d){ return d===0?7:d; },
  getToday(){ const ud=this._jsDay(new Date().getDay()); return this.courses.filter(c=>c.day===ud).sort((a,b)=>{(this._parseTime(a.time)||Infinity)-(this._parseTime(b.time)||Infinity)}); },
  getNextClass(){ const today=this.getToday(),nm=new Date().getHours()*60+new Date().getMinutes(); for(const c of today){ const sm=this._parseTime(c.time); if(sm!==null&&nm<sm) return c; } return null; },

  renderSettings(formEl){

/* ========== Period ========== */
const Period={
  records:[],partnerRecords:[],avgCycle:28,avgDuration:5,
  SYMPTOMS:['腹痛','腰痛','头痛','疲劳','情绪波动','乳房胀痛','其他'],
  CARE_TIPS:{during:['🫖 泡杯红糖水~','🔥 暖宝宝贴小腹~','🛌 早点休息别熬夜~','🍫 适量吃黑巧克力~'],upcoming:['🎒 备好卫生用品~','💧 多喝热水~','😴 保证充足睡眠~'],normal:['🏃 适当运动~','🥗 均衡饮食~','☀️ 晒晒太阳~']},

  async load(){ this.records=(await Sync.loadMyData('periods',[])).map(r=>this._migrate(r)); },
  async loadPartner(){ this.partnerRecords=(await Sync.loadPartnerData('periods',[])).map(r=>this._migrate(r)); },
  async save(){ await Sync.setMyData('periods',this.records); },

  _migrate(r){ if(r.startDate) return r; return{startDate:r.date,endDate:'',symptoms:[]}; },

  addRecord(startDate,endDate,symptoms){ this.records.push({startDate,endDate:endDate||'',symptoms:symptoms||[]}); this.records.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate)); this.save(); },
  removeRecord(i){ this.records.splice(i,1); this.save(); },

  calcAvgCycle(){ const s=[...this.records].sort((a,b)=>new Date(a.startDate)-new Date(b.startDate)),l3=s.slice(-3); if(l3.length<2) return this.avgCycle; let sum=0,c=0; for(let i=1;i<l3.length;i++){ const d=(new Date(l3[i].startDate)-new Date(l3[i-1].startDate))/86400000; if(d>15&&d<45){sum+=d;c++} } return c>0?Math.round(sum/c):this.avgCycle; },
  predictNext(){ if(this.records.length===0) return null; const last=new Date(this.records[this.records.length-1].startDate); last.setDate(last.getDate()+this.calcAvgCycle()); return last; },

  _getPartnerStatus(){
    if(this.partnerRecords.length===0) return null;
    const today=new Date(); today.setHours(0,0,0,0);
    for(const r of this.partnerRecords){
      const s=new Date(r.startDate); s.setHours(0,0,0,0);
      const e=r.endDate?new Date(r.endDate):new Date(s); if(!r.endDate) e.setDate(e.getDate()+this.avgDuration); e.setHours(0,0,0,0);
      if(today>=s&&today<=e){ const dn=Math.floor((today-s)/86400000)+1; return{phase:'during',text:`生理期第 ${dn} 天`,icon:'🌸'}; }
    }
    if(this.partnerRecords.length>0){
      const last=new Date(this.partnerRecords[this.partnerRecords.length-1].startDate);
      last.setDate(last.getDate()+this.avgCycle);
      const diff=Math.ceil((last-today)/86400000);
      if(diff<=3&&diff>=0) return{phase:'upcoming',text:`预计 ${diff===0?'今天':diff+'天后'} 要来`,icon:'🌱'};
    }
    return null;
  },

  getStatus(){
    if(this.records.length===0) return{phase:'no_data',text:'还没有记录哦，在设置里添加吧~',icon:'📝'};
    const today=new Date(); today.setHours(0,0,0,0);
    for(const r of this.records){
      const s=new Date(r.startDate); s.setHours(0,0,0,0);
      const e=r.endDate?new Date(r.endDate):new Date(s); if(!r.endDate) e.setDate(e.getDate()+this.avgDuration); e.setHours(0,0,0,0);
      if(today>=s&&today<=e){ const dn=Math.floor((today-s)/86400000)+1; return{phase:'during',text:`生理期第 ${dn} 天，注意保暖~`,icon:'🌸'}; }
    }
    const next=this.predictNext(); if(next){ const diff=Math.ceil((next-today)/86400000); if(diff<=3&&diff>=0) return{phase:'upcoming',text:`预计 ${diff===0?'今天':diff+'天后'} 要来啦~`,icon:'🌱'}; if(diff<0&&diff>-7) return{phase:'just_ended',text:'刚结束，好好休息~',icon:'🩷'}; return{phase:'normal',text:`下次预计 ${next.getMonth()+1}月${next.getDate()}日~`,icon:'✨'}; }
    return{phase:'normal',text:'一切安好~',icon:'✨'};
  },

  _randomTip(phase){ const t=this.CARE_TIPS[phase]||this.CARE_TIPS.normal; return t[Math.floor(Math.random()*t.length)]; },

  render(el){
    const st=this.getStatus(),tip=this._randomTip(st.phase);
    let h=`<div class="period-phase">${st.icon} ${st.text}</div>`;
    if(st.phase==='upcoming') h+=`<div style="margin-top:4px;font-size:0.82rem;color:#D06060">⚠️ 还有几天就到日子啦，提前准备~</div>`;
    h+=`<div class="period-next">${tip}</div>`;
    // Show partner period status if available
    const pst=this._getPartnerStatus();
    if(pst){
      h+=`<div style="margin-top:6px;padding:6px 10px;background:rgba(240,180,180,0.1);border-radius:8px;font-size:0.82rem"><span style="color:var(--accent-strong);font-weight:600">${partnerUid?(ROLE_EMOJI[partnerRole]||'💕'):'TA'} 的状态：</span>${pst.icon} ${pst.text}</div>`;
    }
    h+=this._renderCal();
    el.innerHTML=h;
  },

  _renderCal(){
    const now=new Date(),y=now.getFullYear(),m=now.getMonth(),td=now.getDate();
    const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),pdm=new Date(y,m,0).getDate();
    const dn=['日','一','二','三','四','五','六'];
    const pd=new Set(),prd=new Set();
    for(const r of this.records){ const s=new Date(r.startDate),e=r.endDate?new Date(r.endDate):new Date(s); if(!r.endDate) e.setDate(e.getDate()+this.avgDuration); for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){ if(d.getMonth()===m&&d.getFullYear()===y) pd.add(d.getDate()); } }
    const next=this.predictNext(); if(next&&next.getMonth()===m&&next.getFullYear()===y){ for(let i=0;i<this.avgDuration;i++){ const d=new Date(next); d.setDate(d.getDate()+i); if(d.getMonth()===m) prd.add(d.getDate()); } }
    let cells='';
    for(let i=fd-1;i>=0;i--) cells+=`<div class="cal-day other-month">${pdm-i}</div>`;
    for(let d=1;d<=dim;d++){ let cls='cal-day'; if(d===td) cls+=' today'; if(pd.has(d)) cls+=' period-day'; else if(prd.has(d)) cls+=' predicted-day'; cells+=`<div class="${cls}">${d}</div>`; }
    return`<div class="period-calendar">${dn.map(n=>`<div class="cal-header">${n}</div>`).join('')}${cells}</div><div style="display:flex;gap:10px;font-size:0.7rem;color:var(--text-sub);justify-content:center"><span>🔴 经期</span><span>🟠 预测</span></div>`;
  },

  renderSettings(formEl){
    formEl.innerHTML=`<div class="settings-section"><h3>🌸 生理期记录</h3><div class="settings-row"><input id="period-start" type="date"><input id="period-end" type="date" placeholder="结束日期(可选)"></div><div style="font-size:0.82rem;color:var(--text-sub);margin-bottom:6px">症状（可多选）：</div><div class="symptom-list" id="symptom-list">${this.SYMPTOMS.map(s=>`<span class="symptom-chip" data-symptom="${s}">${s}</span>`).join('')}</div><div class="settings-row" style="margin-top:8px"><button id="add-period-btn">记录本次</button></div><div id="period-list" style="margin-top:10px"></div></div>`;
    const sel=new Set();
    formEl.querySelectorAll('.symptom-chip').forEach(ch=>{ ch.addEventListener('click',()=>{const s=ch.dataset.symptom; if(sel.has(s)){sel.delete(s);ch.classList.remove('selected')}else{sel.add(s);ch.classList.add('selected')}}); });
    this._renderList(document.getElementById('period-list'));
    document.getElementById('add-period-btn').addEventListener('click',()=>{
      const sd=document.getElementById('period-start').value; if(!sd) return;
      this.addRecord(sd,document.getElementById('period-end').value,[...sel]);
      this._renderList(document.getElementById('period-list'));
      document.getElementById('period-start').value='';document.getElementById('period-end').value='';
      sel.clear();formEl.querySelectorAll('.symptom-chip').forEach(c=>c.classList.remove('selected'));
    });
  },

  _renderList(el){

        const dl=Math.ceil((new Date(e.examDate)-today)/86400000),cls=this.getClass(dl),done=e.tasks.filter(t=>t.done).length,total=e.tasks.length,pct=total>0?Math.round(done/total*100):0;
        return`<div class="exam-item" data-exam="${e.id}" onclick="Exam.toggleTasks(${e.id})"><div style="display:flex;justify-content:space-between;align-items:center"><span class="exam-subject">${e.subject}</span><span class="exam-countdown ${cls}">${dl<=0?'今天！':dl+'天'}</span></div><div class="exam-progress"><div class="exam-progress-bar" style="width:${pct}%"></div></div><div style="font-size:0.75rem;color:var(--text-sub);margin-top:2px">${done}/${total} 任务完成</div><div class="exam-tasks" id="tasks-${e.id}">${e.tasks.map(t=>`<div style="padding:4px 0;font-size:0.85rem"><input type="checkbox" ${t.done?'checked':''} onchange="Exam.toggleTask(${e.id},${t.id})" onclick="event.stopPropagation()"> ${t.text}</div>`).join('')}<div style="margin-top:6px;display:flex;gap:6px"><input id="task-input-${e.id}" placeholder="添加任务..." style="flex:1;padding:6px 10px;border:1px solid #e8d8d0;border-radius:6px;font-size:0.82rem"><button onclick="event.stopPropagation();Exam.addTask(${e.id})" style="padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.8rem">+</button></div></div></div>`;

  addTask(eid){ const e=this.exams.find(x=>x.id===eid); if(!e) return; const inp=document.getElementById('task-input-'+eid); if(!inp||!inp.value.trim()) return; e.tasks.push({id:Date.now(),text:inp.value.trim(),done:false}); inp.value=''; this.save(); this.render(document.getElementById('exam-display')); },

  renderSettings(formEl){
    formEl.innerHTML=`<div class="settings-section"><h3>📝 考试管理</h3><div class="settings-row"><input id="exam-subject" placeholder="科目"><input id="exam-date" type="date"></div><div class="settings-row"><button id="add-exam-btn">+ 添加考试</button></div><div id="exam-list" style="margin-top:10px"></div></div>`;

  _moodEmoji(m){ const map={happy:'😊',normal:'😐',sad:'😢'}; return map[m]||'😐'; },
  _randomReply(mood){ const pool=this._replies[mood]||this._replies.normal; return pool[Math.floor(Math.random()*pool.length)]; },

/* ========== Photos ========== */
const Photos={
  photos:[],partnerPhotos:[],MAX_KB:4500,

  async load(){ this.photos=await Sync.loadMyData('photos',[]); },
  async loadPartner(){ this.partnerPhotos=await Sync.loadPartnerData('photos',[]); },
  async save(){ await Sync.setMyData('photos',this.photos); },

  render(el){
    let h=`<div style="display:flex;gap:8px;margin-bottom:8px"><button id="photo-upload-btn" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer">📷 上传照片</button><input type="text" id="photo-caption" placeholder="添加说明（可选）" style="flex:1;padding:8px;border:1px solid #e8d8d0;border-radius:8px;font-size:0.85rem"></div>`;
    const used=this._storageUsed();
    h+=`<div style="font-size:0.75rem;color:var(--text-sub);margin-bottom:8px">已用 ${used}KB / ${this.MAX_KB}KB</div>`;
    // Partner photos
    if(this.partnerPhotos.length>0){
      h+=`<div style="font-size:0.8rem;color:var(--accent-strong);font-weight:600;margin-bottom:4px">${partnerUid?(ROLE_EMOJI[partnerRole]||'💕'):'TA'} 的照片</div>`;
      h+=`<div class="photo-grid" style="margin-bottom:10px">${this.partnerPhotos.map(p=>`<div class="photo-item"><img src="${p.data}" alt="${p.caption||''}" onclick="Photos.showLightboxPartner('${p.id}')"><div class="photo-caption">${p.caption||''}</div></div>`).join('')}</div>`;
    }
    // Own photos
    if(this.photos.length===0 && this.partnerPhotos.length===0) h+='<div style="color:var(--text-sub);font-size:0.85rem;text-align:center">还没有照片，上传一张吧~</div>';
    else if(this.photos.length>0) h+=`<div class="photo-grid">${this.photos.map(p=>`<div class="photo-item"><img src="${p.data}" alt="${p.caption||''}" onclick="Photos.showLightbox('${p.id}')"><div class="photo-caption">${p.caption||''}</div><button onclick="Photos.remove(${p.id})" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:0.7rem">✕</button></div>`).join('')}</div>`;
    el.innerHTML=h;

    const btn=document.getElementById('photo-upload-btn');
    if(btn) btn.addEventListener('click',()=>{
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) this._upload(f); }); inp.click();
    });
  },

  _storageUsed(){ let t=0; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('couple_my_photos')) t+=(localStorage.getItem(k)||'').length; } return Math.round(t/1024); },

  async _upload(file){
    const reader=new FileReader();
    reader.onload=async ev=>{
      const img=new Image();
      img.onload=async()=>{
        const c=document.createElement('canvas'); const maxW=600; let w=img.width,h=img.height;
        if(w>maxW){ h=h*maxW/w; w=maxW; }
        c.width=w;c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        let q=0.65,data; do{ data=c.toDataURL('image/jpeg',q); q-=0.1; }while(data.length>200*1024&&q>0.15);
        const caption=document.getElementById('photo-caption').value.trim();
        this.photos.push({id:Date.now(),data,caption,createTime:new Date().toISOString()});
        await this.save();
        this.render(document.getElementById('photo-display'));
      }; img.src=ev.target.result;
    }; reader.readAsDataURL(file);
  },

  showLightbox(id){ const p=this.photos.find(x=>x.id===id); if(!p) return; document.getElementById('lightbox-img').src=p.data; document.getElementById('lightbox-caption').textContent=p.caption||''; document.getElementById('photo-lightbox').classList.remove('hidden'); },
  showLightboxPartner(id){ const p=this.partnerPhotos.find(x=>x.id===id); if(!p) return; document.getElementById('lightbox-img').src=p.data; document.getElementById('lightbox-caption').textContent=p.caption||''; document.getElementById('photo-lightbox').classList.remove('hidden'); },

  async remove(id){ if(!confirm('删除这张照片？')) return; this.photos=this.photos.filter(p=>p.id!==id); await this.save(); this.render(document.getElementById('photo-display')); }
};

/* ========== SOS ========== */
const SOS={
  contacts:[],
  load(){ this.contacts=LS.get('sos_contacts',[]); },
  save(){ LS.set('sos_contacts',this.contacts); },

  render(){
    const btn=document.getElementById('sos-button');
    if(this.contacts.length>0){ btn.classList.add('visible'); btn.onclick=()=>this._showModal(); }
    else btn.classList.remove('visible');
  },

  _showModal(){
    const ov=document.createElement('div'); ov.className='sos-modal-overlay';
    ov.innerHTML=`<div class="sos-modal"><h3>🆘 发送求助</h3><p style="margin:12px 0;font-size:0.9rem;color:var(--text-sub)">将向 ${this.contacts.length} 位联系人发送你的位置</p><div style="display:flex;gap:10px;justify-content:center"><button id="sos-cancel" style="padding:10px 20px;border:1px solid #ddd;border-radius:999px;background:var(--card-bg);cursor:pointer">取消</button><button id="sos-confirm" style="padding:10px 20px;background:#E84040;color:#fff;border:none;border-radius:999px;cursor:pointer">确认发送</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#sos-cancel').addEventListener('click',()=>ov.remove());
    ov.querySelector('#sos-confirm').addEventListener('click',()=>{ ov.remove(); this._send(); });
  },

  _send(){
    if(!navigator.geolocation){ alert('你的设备不支持定位'); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const{latitude,longitude}=pos.coords;
      const body=`🆘 我需要帮助！\n位置: https://maps.google.com/?q=${latitude},${longitude}\n经纬度: ${latitude}, ${longitude}`;
      const phones=this.contacts.map(c=>c.phone).filter(Boolean).join(',');
      if(phones) window.location.href=`sms:${phones}?body=${encodeURIComponent(body)}`;
      else alert('请先在设置中添加联系人手机号');
    },()=>{ alert('无法获取位置，请检查定位权限'); },{enableHighAccuracy:true,timeout:10000});
  },

  renderSettings(formEl){
    formEl.innerHTML=`<div class="settings-section"><h3>🆘 紧急联系人（最多3个）</h3><div id="sos-contacts-list"></div>${this.contacts.length<3?`<div class="settings-row" style="margin-top:8px"><input id="sos-name" placeholder="姓名"><input id="sos-phone" type="tel" placeholder="手机号"><button id="add-sos-btn">添加</button></div>`:''}</div>`;
    this._renderList(document.getElementById('sos-contacts-list'));
    const ab=document.getElementById('add-sos-btn'); if(ab) ab.addEventListener('click',()=>{ const n=document.getElementById('sos-name').value.trim(),p=document.getElementById('sos-phone').value.trim(); if(!n||!p) return; this.contacts.push({name:n,phone:p}); this.save(); this.renderSettings(formEl); });
  },

  _renderList(el){ el.innerHTML=this.contacts.length===0?'<div style="color:var(--text-sub);font-size:0.85rem">还没有联系人~</div>':this.contacts.map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:0.85rem;border-bottom:1px solid #f0ebe0"><span>${c.name} · ${c.phone}</span><button onclick="SOS.removeContact(${i})" class="delete-btn">删除</button></div>`).join(''); },
  removeContact(i){ this.contacts.splice(i,1); this.save(); SOS.renderSettings(document.getElementById('settings-form')); }
};

/* ========== Notify ========== */
const Notify={
  timers:[],_countToday:0,

  checkAndShow(){
    const today=new Date().toDateString();
    const last=LS.get('notify',{date:null,count:0});
    if(last.date!==today){ last.date=today; last.count=0; }
    this._countToday=last.count;
    if(this._countToday>=2) return;

    const morningMs=this._randomMs(8,12),afternoonMs=this._randomMs(14,21);
    const now=Date.now(),midnight=new Date(); midnight.setHours(24,0,0,0);
    const todayMs=midnight.getTime()-now;

    if(this._countToday===0&&morningMs<todayMs){
      this.timers.push(setTimeout(()=>this._fire(),morningMs));
    }
    if(this._countToday<=1&&afternoonMs<todayMs){
      this.timers.push(setTimeout(()=>this._fire(),afternoonMs));
    }
  },

  _randomMs(h1,h2){ const start=new Date(); start.setHours(h1,Math.floor(Math.random()*60),0,0); const end=new Date(); end.setHours(h2,0,0,0); const range=end.getTime()-start.getTime(); return Math.max(300000,start.getTime()+Math.random()*range-Date.now()); },

  async _fire(){
    const today=new Date().toDateString();
    const last=LS.get('notify',{date:null,count:0});
    if(last.date!==today){ last.date=today; last.count=0; }
    if(last.count>=2) return;
    last.count++; LS.set('notify',last);

    const weather=Weather.cache;
    const courses=Schedule.getToday().length;
    const period=Period.getStatus();
    const lastDiary=LS.get('my_diary',[]);
    const mood=lastDiary.length>0?lastDiary[lastDiary.length-1].mood:null;
    const exam=Exam.exams.length>0?Exam.exams.sort((a,b)=>new Date(a.examDate)-new Date(b.examDate))[0]:null;

    let msg='';
    if(weather){ if(parseInt(weather.icon)>=300) msg+='今天有雨🌧，带伞哦~ '; else if(parseInt(weather.temp)>30) msg+='今天很热☀️，多喝水~ '; else if(parseInt(weather.temp)<10) msg+='今天很冷❄️，注意保暖~ '; }
    if(courses>0) msg+=`今天有${courses}节课。`;
    if(period.phase==='during') msg+='生理期注意休息🌸 ';
    if(period.phase==='upcoming') msg+='生理期快来了，提前准备~ ';
    if(exam){ const dl=Math.ceil((new Date(exam.examDate)-new Date())/86400000); if(dl<=7&&dl>0) msg+=`${exam.subject}还有${dl}天！`; }
    if(!msg) msg='今天也是美好的一天呢~';
    this._toast(msg);
    if('Notification' in window&&Notification.permission==='granted') new Notification('情侣空间',{body:msg,icon:'icon-192.png'});
  },

  _toast(msg){ const el=document.getElementById('notify-toast'); if(!el) return; el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),8000); }
};

const Messages={
  get(h,weatherCode,courses,temp){
    let cat='day'; if(h>=6&&h<9) cat='morning'; else if(h>=17&&h<21) cat='evening'; else if(h>=21||h<6) cat='night';
    if(weatherCode&&weatherCode>=300&&weatherCode<500) cat='rain';
    else if(temp!==undefined&&temp!==null){ if(temp>30) cat='hot'; else if(temp<10) cat='cold'; }
    if(courses!==undefined){ if(courses>=5) cat='busy'; else if(courses<=1) cat='relax'; }
    return this._pick(cat);
  },
  _pick(cat){
    const pools={morning:['清晨的第一缕阳光，是今天的第一份礼物~','早安！今天也要元气满满地起床哦~','新的一天，新的可爱！','今天早上有你喜欢的那门课哦，打起精神来！'],day:['努力学习的你最迷人了~','如果累了就摸摸头，我在呢！','今天的你比昨天更聪明了一点点~','喝口水吧，你的大脑需要补充水分啦！'],evening:['今天辛苦了，奖励自己一杯热饮吧~','把所有烦恼都留在今天，明天拿快乐回来~','你已经做得很好了，真的！','晚霞好美，像你今天的心情一样温柔~'],night:['关掉手机，闭上眼睛，放松下来~','今天的你也超棒的，晚安！','夜深了，该跟今天说拜拜啦~','睡前喝一杯热牛奶，做个甜甜的梦~'],rain:['下雨天适合发呆，也适合想我~','窗外滴答滴答，是天空在给你弹小曲~','雨天最适合窝在被窝里了，羡慕！','出门记得带伞！淋湿了我会心疼的~'],busy:['今天课好多呀，记得中间休息一下！','课多说明你重要呀，大家都在抢着教你呢~','撑过今天，你就又强大了！','水壶带了吗？忙起来最容易忘记喝水了~'],relax:['惬意的一天，适合做点喜欢的事~','闲下来的时候就发发呆，那也是一种幸福~','今天节奏刚刚好，享受吧~','今天可以慢悠悠地吃早餐，不用赶时间~'],hot:['今天好热呀！记得多喝水~','出门一定要带遮阳伞，太阳公公今天太热情了！','天热的时候最适合喝冰镇柠檬水啦~','这么热的天还坚持上课，你简直是勇士！'],cold:['今天好冷呀！围巾手套帽子全部武装起来~','出门前喝一杯热水，让身体从里到外暖起来~','冷天最适合穿厚厚的，像个小团子一样可爱~','手冻僵了的话就搓一搓，哈一口热气~']};
    const msgs=pools[cat]||pools.day; return msgs[Math.floor(Math.random()*msgs.length)];
  }
};

  async unpair(){
    if(!confirm('确定要解除配对吗？')) return;
    if(partnerUid){ await firebase.database().ref('users/'+myUid+'/partnerUid').remove(); await firebase.database().ref('users/'+partnerUid+'/partnerUid').remove(); }
    LS.remove('partnerUid'); partnerUid=null;
    location.reload();
  },

  _renderDiarySettings(formEl){
    formEl.innerHTML=`<div class="settings-section"><h3>📔 心情日记</h3><p style="font-size:0.85rem;color:var(--text-sub)">日记在主页面直接编写，这里查看所有历史日记。</p><div id="all-diary-list"></div>${partnerUid?`<h4 style="margin-top:16px;color:var(--accent-strong)">${ROLE_EMOJI[partnerRole]||'💕'} 的日记</h4><div id="partner-diary-list"></div>`:''}</div>`;
    const listEl=document.getElementById('all-diary-list');
    if(Diary.entries.length===0) listEl.innerHTML='<div style="color:var(--text-sub);font-size:0.85rem">还没有日记~</div>';
    else listEl.innerHTML=Diary.entries.slice().reverse().map(e=>`<div style="padding:8px 0;border-bottom:1px solid #f0ebe0;display:flex;justify-content:space-between;align-items:center"><span style="font-size:0.85rem">${Diary._moodEmoji(e.mood)} ${e.content.slice(0,30)}...</span><span style="font-size:0.75rem;color:var(--text-sub)">${new Date(e.createTime).toLocaleDateString('zh-CN')}</span><button onclick="Diary.remove(${e.id});App._renderDiarySettings(document.getElementById('settings-form'))" class="delete-btn">删除</button></div>`).join('');
    if(partnerUid){
      const pListEl=document.getElementById('partner-diary-list');
      if(pListEl){
        if(Diary.partnerEntries.length===0) pListEl.innerHTML='<div style="color:var(--text-sub);font-size:0.85rem">TA 还没有日记~</div>';
        else pListEl.innerHTML=Diary.partnerEntries.slice().reverse().map(e=>`<div style="padding:8px 0;border-bottom:1px solid #f0ebe0;font-size:0.85rem"><span>${Diary._moodEmoji(e.mood)} ${e.content.slice(0,40)}...</span><span style="font-size:0.75rem;color:var(--text-sub);margin-left:8px">${new Date(e.createTime).toLocaleDateString('zh-CN')}</span></div>`).join('');
      }
    }
  },

  startTimers(){
    setInterval(()=>{ this.updateGreeting(); this.updateSchedule(); },60000);
    setInterval(()=>{ this.updateWeather(); },30*60*1000);
    const now=new Date(),msToMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).getTime()-now.getTime();
    setTimeout(()=>{ this.updateFortune(); this.updateGreeting(); setInterval(()=>{this.updateFortune();this.updateGreeting()},24*60*60*1000); },msToMidnight+1000);
  }
};

/* ═══════════════════════════════════════════════
   Kawaii Decoration Engine
   ═══════════════════════════════════════════════ */
const KawaiiDeco = {
  sakuraEmojis: ['🌸','💮','🌺','🍀','🌷','🪷','✿','❀','🌼','💐','🌾','🍂','🌿'],
  bubbleEmojis: ['💗','💖','💝','💕','💓','🫧','✨','⭐','🌟','💫','🩷','🐾','🎀','🦴','💎','🍬','🍭'],
  trailEmojis: ['💗','💕','💖','🩷','✨','💝','🐾','🎀','💫'],

  init(){
    this.startSakura();
    this.startBubbles();
    this.startClickTrail();
    this.startTitleSparkles();
    this.startGarlandTwinkle();
    this.addCardDecorations();
  },

  startSakura(){
    const container = document.getElementById('sakura-container');
    if(!container) return;
    // Spawn initial petals
    for(let i=0; i<14; i++){
      this._spawnPetal(container, Math.random()*15);
    }
    // Periodically add more
    setInterval(()=>{
      if(document.hidden) return;
      this._spawnPetal(container, 0);
    }, 2800);
  },

  _spawnPetal(container, delay){
    const petal = document.createElement('span');
    petal.className = 'sakura-petal';
    petal.textContent = this.sakuraEmojis[Math.floor(Math.random()*this.sakuraEmojis.length)];
    petal.style.left = Math.random()*95+'%';
    petal.style.fontSize = (0.8 + Math.random()*1.6)+'rem';
    petal.style.animationDuration = (10 + Math.random()*18)+'s';
    petal.style.animationDelay = delay+'s';
    petal.style.opacity = (0.2 + Math.random()*0.4);
    container.appendChild(petal);
    // Remove after animation ends
    setTimeout(()=>{ if(petal.parentNode) petal.remove(); }, (28+delay)*1000);
  },

  startBubbles(){
    const container = document.getElementById('kawaii-float');
    if(!container) return;
    const spawnBubble = () => {
      if(document.hidden) return;
      const bubble = document.createElement('span');
      bubble.className = 'kawaii-bubble';
      bubble.textContent = this.bubbleEmojis[Math.floor(Math.random()*this.bubbleEmojis.length)];
      bubble.style.left = (5 + Math.random()*90)+'%';
      bubble.style.fontSize = (0.7 + Math.random()*1.5)+'rem';
      bubble.style.animationDuration = (6 + Math.random()*14)+'s';
      bubble.style.opacity = (0.1 + Math.random()*0.3);
      container.appendChild(bubble);
      setTimeout(()=>{ if(bubble.parentNode) bubble.remove(); }, 20000);
    };
    for(let i=0; i<8; i++) setTimeout(spawnBubble, i*800);
    setInterval(spawnBubble, 3500);
  },

  startClickTrail(){
    document.addEventListener('click', e => {
      const emoji = this.trailEmojis[Math.floor(Math.random()*this.trailEmojis.length)];
      const heart = document.createElement('span');
      heart.className = 'heart-trail';
      heart.textContent = emoji;
      heart.style.left = e.clientX+'px';
      heart.style.top = e.clientY+'px';
      document.body.appendChild(heart);
      setTimeout(()=> heart.remove(), 750);
    });
  },

  startTitleSparkles(){
    // Add sparkle stars around titles periodically
    const container = document.getElementById('sparkles');
    if(!container) return;
    const spawn = () => {
      if(document.hidden) return;
      const star = document.createElement('span');
      star.className = 'sparkle-star';
      star.textContent = ['✦','✧','⋆','˚','✶','✷','✸'][Math.floor(Math.random()*7)];
      star.style.left = (3+Math.random()*94)+'%';
      star.style.top = (5+Math.random()*90)+'%';
      star.style.animationDuration = (1+Math.random()*2.5)+'s';
      star.style.animationDelay = Math.random()*1.5+'s';
      container.appendChild(star);
      setTimeout(()=> star.remove(), 4000);
    };
    for(let i=0; i<12; i++) setTimeout(spawn, i*600);
    setInterval(spawn, 3000);
  },

  startGarlandTwinkle(){
    // Add subtle twinkling to existing decoration elements
    const cards = document.querySelectorAll('.card');
    cards.forEach((card,i) => {
      if(i%3===0) card.classList.add('magic-glow');
    });
  },

  addCardDecorations(){
    // Add washi tape corners to some cards
    const cards = document.querySelectorAll('.card');
    cards.forEach((card,i) => {
      if(i%2===0 && !card.id){
        const tape = document.createElement('div');
        tape.className = 'washi-corner';
        tape.style.background = ['#FFD1DC','#E8D5F5','#D4F0E8','#FFE4D0','#D6EAF8'][i%5];
        card.appendChild(tape);
      }
    });
  },

  // Call when couple pairs — celebratory confetti
  celebrate(){
    const emojis = '🎉🎊💕💗💖✨🌟💝🩷🎀💫🐶🐾'.split('');
    for(let i=0; i<35; i++){
      setTimeout(()=>{
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        piece.style.left = (5+Math.random()*90)+'%';
        piece.style.top = (10+Math.random()*50)+'%';
        piece.style.setProperty('--cx',((Math.random()-0.5)*280)+'px');
        piece.style.setProperty('--cy',(-100-Math.random()*300)+'px');
        piece.style.setProperty('--cr',(Math.random()*720-360)+'deg');
        document.body.appendChild(piece);
        setTimeout(()=>piece.remove(), 1300);
      }, i*40);
    }
  },

  // Burst hearts from a specific element
  burstFrom(el){
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    for(let i=0; i<12; i++){
      const heart = document.createElement('span');
      heart.className = 'confetti-piece';
      heart.textContent = ['💗','💕','💖','✨','💝'][i%5];
      heart.style.left = cx+'px';
      heart.style.top = cy+'px';
      heart.style.setProperty('--cx',((Math.random()-0.5)*200)+'px');
      heart.style.setProperty('--cy',(-60-Math.random()*180)+'px');
      heart.style.setProperty('--cr',(Math.random()*360-180)+'deg');
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(), 1300);
    }
  }
};

/* ========== Boot ========== */
window.addEventListener('DOMContentLoaded',()=>{
  // Lightbox close
  document.getElementById('photo-lightbox').addEventListener('click',function(e){ if(e.target===this||e.target.classList.contains('lightbox-close')) this.classList.add('hidden'); });

  // Init kawaii decoration engine
  KawaiiDeco.init();

  // Start auth flow
  Auth.init();
});
</script>
